<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img">
<!-- The memex social card: the 1200×630 image every page names in og:image and the GitHub repo uses as its social preview; og.png is its render (headless Chrome, 1200×630). Light palette from site.css, font stacks from site.js; on the right, the scale diagram's motif: dim code blocks under header strips, with a dotted trail through the gutters lighting the few strips it reads. -->
<title>memex: a codebase map for AI coding agents</title>
<style>
.bg { fill: #faf7f0; }
.ink { fill: #1c1a17; }
.rust { fill: #9a3d17; }
.muted { fill: #5c574d; }
.serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "URW Palladio L", P052, "Book Antiqua", Georgia, serif; }
.mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
.code { fill: #ebe5d7; stroke: #d8d1c0; stroke-width: 1; }
.code.read { fill: #f6ebe1; stroke: #9a3d17; stroke-width: 1.5; }
.cl { stroke: #d3cab6; stroke-width: 3; stroke-linecap: round; }
.cl.hot { stroke: #9a3d17; opacity: .55; }
.strip { fill: #9a3d17; opacity: .26; }
.strip.lit { opacity: 1; }
.trail { fill: none; stroke: #9a3d17; stroke-width: 2; stroke-dasharray: 0.1 7; stroke-linecap: round; stroke-linejoin: round; opacity: .55; }
.rule { stroke: #948462; stroke-width: 1.5; stroke-dasharray: 5 5; }
</style>
