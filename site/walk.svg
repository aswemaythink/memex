<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 546" width="400" height="546" role="img">
<!-- The walk diagram of the memex site: two agents in turn move down a rail beside a still repo tree, lighting each README and header chip they read; one understands the API from READMEs and headers alone, the other opens the model and the migration it must change. It follows light and dark through its own prefers-color-scheme block. -->
<title>Two agents walk the intent layer</title>
<desc>A repo tree: repo; src with api, which holds model.ts, handler.ts and store.ts; and db with 001_orders.sql. Every chip starts dim. The first agent, out to understand the API, reads the READMEs of repo, src and api and the headers of the three api files, and opens no code. The second, changing the schema, reads the same READMEs and the header of model.ts and opens it, then reads the db README and the header of 001_orders.sql and opens that migration; handler.ts and store.ts stay dim.</desc>
<style>
svg { --bg: #faf7f0; --fg: #1c1a17; --muted: #5c574d; --accent: #9a3d17; --on-accent: #faf7f0; --rule: #d8d1c0; --code: #ebe5d7; --code-line: #d3cab6; color: var(--fg); }
@media (prefers-color-scheme: dark) { svg { --bg: #141310; --fg: #ebe7dd; --muted: #a8a295; --accent: #eca071; --on-accent: #141310; --rule: #35322a; --code: #0c0b09; --code-line: #2a2722; } }
text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: var(--muted); }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.node { font-size: 11px; fill: var(--fg); }
.lab { font-size: 7.5px; letter-spacing: .04em; }
.tree { fill: none; stroke: var(--rule); stroke-width: 1.25; }
.dim rect { fill: var(--bg); stroke: var(--rule); stroke-width: 1; }
.dim text { fill: var(--muted); opacity: .8; font-weight: 600; }
.dim .lab { font-weight: 400; }
.lit { opacity: 0; animation: 16s linear infinite; }
.readme rect { fill: var(--accent); }
.readme text { fill: var(--on-accent); font-weight: 600; }
.readme .lab { opacity: .8; font-weight: 400; }
.header rect { fill: var(--bg); stroke: var(--accent); stroke-width: 1.5; }
.header text { fill: var(--accent); font-weight: 600; }
.header .lab { opacity: .75; font-weight: 400; }
.code { fill: var(--code); stroke: var(--rule); stroke-width: 1; }
.cl { stroke: var(--code-line); stroke-width: 3; stroke-linecap: round; }
.open { fill: none; stroke: var(--accent); stroke-width: 1.25; stroke-dasharray: 4 3; }
.run { fill: none; stroke: var(--accent); stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: 16s linear infinite; }
.agent { fill: var(--accent); }
.rail { fill: none; stroke: var(--rule); stroke-width: 1.5; stroke-dasharray: 1.5 3.5; stroke-linecap: round; }
.task { font-size: 12px; font-weight: 600; fill: var(--accent); opacity: 0; animation: 16s linear infinite; }
.task .lab { fill: var(--muted); font-weight: 400; }
@keyframes task0 { 0%, 46% { opacity: 1; } 49%, 99% { opacity: 0; } 100% { opacity: 1; } }
@keyframes task1 { 0%, 49% { opacity: 0; } 51%, 96% { opacity: 1; } 99%, 100% { opacity: 0; } }
.tie { fill: none; stroke: var(--rule); stroke-width: 1.25; stroke-dasharray: 1.5 3; stroke-linecap: round; }
.stop { fill: var(--rule); stroke: var(--rule); stroke-width: 1.5; }
.on .tie { stroke: var(--accent); opacity: .8; }
.on .stop { fill: var(--accent); stroke: var(--accent); stroke-width: 2; }
@keyframes run0 { 0%, 0.0% { stroke-dashoffset: 1000; opacity: 1; } 27.5%, 45.0% { stroke-dashoffset: 0; opacity: 1; } 49.0%, 100% { stroke-dashoffset: 0; opacity: 0; } }
@keyframes run1 { 0%, 50.0% { stroke-dashoffset: 1000; opacity: 1; } 77.5%, 95.0% { stroke-dashoffset: 0; opacity: 1; } 99.0%, 100% { stroke-dashoffset: 0; opacity: 0; } }
@keyframes l-repo { 0% { opacity: 0; } 0.9% { opacity: 0; } 1.5%, 45.0% { opacity: 1; } 48.0% { opacity: 0; } 50.4% { opacity: 0; } 51.0%, 95.0% { opacity: 1; } 98.0% { opacity: 0; } 100% { opacity: 0; } }
@keyframes l-src { 0% { opacity: 0; } 4.4% { opacity: 0; } 5.0%, 45.0% { opacity: 1; } 48.0% { opacity: 0; } 52.7% { opacity: 0; } 53.3%, 95.0% { opacity: 1; } 98.0% { opacity: 0; } 100% { opacity: 0; } }
@keyframes l-api { 0% { opacity: 0; } 7.8% { opacity: 0; } 8.4%, 45.0% { opacity: 1; } 48.0% { opacity: 0; } 54.9% { opacity: 0; } 55.5%, 95.0% { opacity: 1; } 98.0% { opacity: 0; } 100% { opacity: 0; } }
@keyframes l-model { 0% { opacity: 0; } 11.3% { opacity: 0; } 11.9%, 45.0% { opacity: 1; } 48.0% { opacity: 0; } 57.1% { opacity: 0; } 57.7%, 95.0% { opacity: 1; } 98.0% { opacity: 0; } 100% { opacity: 0; } }
@keyframes l-hand { 0% { opacity: 0; } 18.6% { opacity: 0; } 19.2%, 45.0% { opacity: 1; } 48.0% { opacity: 0; } 100% { opacity: 0; } }
@keyframes l-store { 0% { opacity: 0; } 26.9% { opacity: 0; } 27.5%, 45.0% { opacity: 1; } 48.0% { opacity: 0; } 100% { opacity: 0; } }
@keyframes l-db { 0% { opacity: 0; } 71.7% { opacity: 0; } 72.3%, 95.0% { opacity: 1; } 98.0% { opacity: 0; } 100% { opacity: 0; } }
@keyframes l-sql { 0% { opacity: 0; } 74.0% { opacity: 0; } 74.6%, 95.0% { opacity: 1; } 98.0% { opacity: 0; } 100% { opacity: 0; } }
@keyframes l-open-model { 0% { opacity: 0; } 58.6% { opacity: 0; } 59.2%, 95.0% { opacity: 1; } 98.0% { opacity: 0; } 100% { opacity: 0; } }
@keyframes l-open-sql { 0% { opacity: 0; } 77.9% { opacity: 0; } 78.5%, 95.0% { opacity: 1; } 98.0% { opacity: 0; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .run, .agent, .lit, .task { animation: none !important; }
  .run0 { stroke-dashoffset: 0; } .r0, .task0 { opacity: 1; } .run1 { opacity: 0; }
}
</style>
