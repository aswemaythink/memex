<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 362 494" width="362" height="494" role="img">
<!-- The walk diagram of the memex site: an agent walks a repo's READMEs and headers top-down and opens code last. It follows light and dark through its own prefers-color-scheme block. -->
<title>An agent walks the READMEs and headers</title>
<desc>A repo tree: repo, src, api with handler.ts and store.ts, and a sibling folder db. Each folder carries a filled chip with its README one-liner; each file an outlined chip with its header's purpose line and a dim block of code. A path runs down through repo, src, api and handler.ts, and only at the end enters the much larger code of handler.ts.</desc>
<style>
svg { --bg: #faf7f0; --fg: #1c1a17; --muted: #5c574d; --accent: #9a3d17; --on-accent: #faf7f0; --rule: #d8d1c0; --code: #ebe5d7; --code-line: #d3cab6; color: var(--fg); }
@media (prefers-color-scheme: dark) { svg { --bg: #141310; --fg: #ebe7dd; --muted: #a8a295; --accent: #eca071; --on-accent: #141310; --rule: #35322a; --code: #0c0b09; --code-line: #2a2722; } }
text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: currentColor; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.node { font-size: 11px; }
.mut { fill: var(--muted); }
.tree { fill: none; stroke: var(--rule); stroke-width: 1.25; }
.chip { fill: var(--accent); }
.chip-t { fill: var(--on-accent); font-weight: 600; }
.chip-o { fill: var(--bg); stroke: var(--accent); stroke-width: 1.5; }
.chip-o-t { fill: var(--accent); font-weight: 600; }
.lab, .lab-on { font-size: 7.5px; letter-spacing: .04em; }
.lab { fill: var(--accent); opacity: .75; }
.lab-on { fill: var(--on-accent); opacity: .8; }
.code { fill: var(--code); stroke: var(--rule); stroke-width: 1; }
.cl { stroke: var(--code-line); stroke-width: 3; stroke-linecap: round; }
.open { fill: none; stroke: var(--accent); stroke-width: 1.25; stroke-dasharray: 4 3; }
.trail { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 2 4; stroke-linecap: round; opacity: .5; }
.run { fill: none; stroke: var(--accent); stroke-width: 2.25; stroke-linecap: round; stroke-dasharray: 600; stroke-dashoffset: 600; animation: walk 7s ease-in-out infinite; }
.stop { fill: var(--bg); stroke: var(--accent); stroke-width: 2; }
.agent { fill: var(--accent); }
@keyframes walk { 0% { stroke-dashoffset: 600; } 70%, 88% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .run { animation: none; stroke-dashoffset: 0; } }
</style>

