<path class="cl" d="M174 180h146M174 190h145M174 200h93M174 210h145M174 220h60M166 230h138M174 240h96M182 250h114M166 260h48M174 270h74M166 280h47M174 290h139M182 300h117M158 310h112M174 320h93M182 330h130"/>
