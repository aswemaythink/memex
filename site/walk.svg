<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 372 496" width="372" height="496" role="img">
<!-- The walk diagram of the memex site: two agents in turn walk a repo tree, lighting each README, header and collection chip they read, and each opens one file's code. It follows light and dark through its own prefers-color-scheme block. -->
<title>Two agents walk the intent layer</title>
<desc>A repo tree: repo; src with api, which holds API.md, handler.ts and store.ts; and db with 001_orders.sql. Every chip starts dim. The first agent walks repo, src and api, passes the api collection doc API.md, reads the header of handler.ts and opens its code. The second agent reads the repo README, skips src, reads the db README and the header of 001_orders.sql, and opens that migration.</desc>
<style>
svg { --bg: #faf7f0; --fg: #1c1a17; --muted: #5c574d; --accent: #9a3d17; --on-accent: #faf7f0; --rule: #d8d1c0; --code: #ebe5d7; --code-line: #d3cab6; color: var(--fg); }
@media (prefers-color-scheme: dark) { svg { --bg: #141310; --fg: #ebe7dd; --muted: #a8a295; --accent: #eca071; --on-accent: #141310; --rule: #35322a; --code: #0c0b09; --code-line: #2a2722; } }
text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: var(--muted); }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.node { font-size: 11px; fill: var(--fg); }
.lab { font-size: 7.5px; letter-spacing: .04em; }
.tree { fill: none; stroke: var(--rule); stroke-width: 1.25; }
.dim rect { fill: var(--bg); stroke: var(--rule); stroke-width: 1; }
.dim text { fill: var(--muted); opacity: .8; }
.lit { opacity: 0; animation: 16s linear infinite; }
.readme rect { fill: var(--accent); }
.readme text { fill: var(--on-accent); font-weight: 600; }
.readme .lab { opacity: .8; font-weight: 400; }
.header rect { fill: var(--bg); stroke: var(--accent); stroke-width: 1.5; }
.header text, .coll text { fill: var(--accent); font-weight: 600; }
.header .lab, .coll .lab { opacity: .75; font-weight: 400; }
.coll rect { fill: var(--bg); stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 3 2; }
.code { fill: var(--code); stroke: var(--rule); stroke-width: 1; }
.cl { stroke: var(--code-line); stroke-width: 3; stroke-linecap: round; }
.open { fill: none; stroke: var(--accent); stroke-width: 1.25; stroke-dasharray: 4 3; }
.run { fill: none; stroke: var(--accent); stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: 16s linear infinite; }
.agent { fill: var(--accent); opacity: 0; animation: 16s linear infinite; }
@keyframes run0 { 0%, 0.0% { stroke-dashoffset: 1000; opacity: 1; } 27.5%, 45.0% { stroke-dashoffset: 0; opacity: 1; } 49.0%, 100% { stroke-dashoffset: 0; opacity: 0; } }
@keyframes agent0 { 0%, 0.0% { opacity: 0; } 0.1%, 45.0% { opacity: 1; } 49.0%, 100% { opacity: 0; } }
@keyframes run1 { 0%, 50.0% { stroke-dashoffset: 1000; opacity: 1; } 77.5%, 95.0% { stroke-dashoffset: 0; opacity: 1; } 99.0%, 100% { stroke-dashoffset: 0; opacity: 0; } }
@keyframes agent1 { 0%, 49.9% { opacity: 0; } 50.1%, 95.0% { opacity: 1; } 99.0%, 100% { opacity: 0; } }
@keyframes l-repo { 0% { opacity: 0; } -0.1% { opacity: 0; } 0.5%, 45.0% { opacity: 1; } 48.0% { opacity: 0; } 49.9% { opacity: 0; } 50.5%, 95.0% { opacity: 1; } 98.0% { opacity: 0; } 100% { opacity: 0; } }
@keyframes l-src { 0% { opacity: 0; } 4.8% { opacity: 0; } 5.4%, 45.0% { opacity: 1; } 48.0% { opacity: 0; } 100% { opacity: 0; } }
@keyframes l-api { 0% { opacity: 0; } 10.2% { opacity: 0; } 10.8%, 45.0% { opacity: 1; } 48.0% { opacity: 0; } 100% { opacity: 0; } }
@keyframes l-apimd { 0% { opacity: 0; } 15.6% { opacity: 0; } 16.2%, 45.0% { opacity: 1; } 48.0% { opacity: 0; } 100% { opacity: 0; } }
@keyframes l-hand { 0% { opacity: 0; } 26.9% { opacity: 0; } 27.5%, 45.0% { opacity: 1; } 48.0% { opacity: 0; } 100% { opacity: 0; } }
@keyframes l-open-hand { 0% { opacity: 0; } 28.9% { opacity: 0; } 29.5%, 45.0% { opacity: 1; } 48.0% { opacity: 0; } 100% { opacity: 0; } }
@keyframes l-db { 0% { opacity: 0; } 74.3% { opacity: 0; } 74.9%, 95.0% { opacity: 1; } 98.0% { opacity: 0; } 100% { opacity: 0; } }
@keyframes l-sql { 0% { opacity: 0; } 76.9% { opacity: 0; } 77.5%, 95.0% { opacity: 1; } 98.0% { opacity: 0; } 100% { opacity: 0; } }
@keyframes l-open-sql { 0% { opacity: 0; } 78.9% { opacity: 0; } 79.5%, 95.0% { opacity: 1; } 98.0% { opacity: 0; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .run, .agent, .lit { animation: none !important; }
  .run0 { stroke-dashoffset: 0; } .agent0, .r0 { opacity: 1; } .run1 { opacity: 0; }
}
</style>
