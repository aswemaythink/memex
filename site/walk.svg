<text x="8" y="30" class="mono node">repo/</text>
<rect class="chip" x="146" y="15" width="188" height="22" rx="11"/>
<text x="157" y="29" class="mono lab-on">README</text><text x="191.6" y="29.5" class="chip-t">A small orders service.</text>
<text x="20" y="70" class="mono node">src/</text>
<rect class="chip" x="146" y="55" width="165" height="22" rx="11"/>
<text x="157" y="69" class="mono lab-on">README</text><text x="191.6" y="69.5" class="chip-t">The service source.</text>
