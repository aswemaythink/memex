<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 362 313" width="362" height="313" role="img">
<!-- The scale diagram of the memex site: sixty files, each a dim block of code under a thin orange strip of intent, and one context window that holds three files of code or the whole intent layer. It follows light and dark through its own prefers-color-scheme block. -->
<title>The intent layer fits where the code does not</title>
<desc>A grid of sixty dim blocks of code, each topped by a thin orange strip: its README or header. An agent runs along the strips row by row and opens one block at the end. Below, two equal context windows: one holds three files of code with a fourth spilling past its edge; the other holds all sixty strips with room to spare.</desc>
<style>
svg { --bg: #faf7f0; --fg: #1c1a17; --muted: #5c574d; --accent: #9a3d17; --rule: #d8d1c0; --code: #ebe5d7; --code-line: #d3cab6; color: var(--fg); }
@media (prefers-color-scheme: dark) { svg { --bg: #141310; --fg: #ebe7dd; --muted: #a8a295; --accent: #eca071; --rule: #35322a; --code: #0c0b09; --code-line: #2a2722; } }
text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: currentColor; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.mut { fill: var(--muted); }
.lab { font-size: 7.5px; letter-spacing: .04em; fill: var(--muted); }
.code { fill: var(--code); stroke: var(--rule); stroke-width: 1; }
.cl { stroke: var(--code-line); stroke-width: 2; stroke-linecap: round; }
.strip { fill: var(--accent); }
.dimstrip { fill: var(--accent); opacity: .4; }
.frame { fill: none; stroke: var(--muted); stroke-width: 1; }
.spill { fill: none; stroke: var(--rule); stroke-width: 1; stroke-dasharray: 3 3; }
.open { fill: none; stroke: var(--accent); stroke-width: 1.25; stroke-dasharray: 3 2.5; }
.sweep { fill: none; stroke: #fff; stroke-width: 8; stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: sweep 10s linear infinite; }
.agent { fill: var(--accent); stroke: var(--bg); stroke-width: 1.5; offset-rotate: 0deg; animation: run 10s linear infinite; }
.open { animation: open 10s linear infinite; }
@keyframes sweep { 0% { stroke-dashoffset: 1000; } 72%, 100% { stroke-dashoffset: 0; } }
@keyframes run { 0% { offset-distance: 0%; opacity: 1; } 72%, 92% { offset-distance: 100%; opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
@keyframes open { 0%, 70% { opacity: 0; } 76%, 94% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .sweep, .agent, .open { animation: none; } .sweep { stroke-dashoffset: 0; } .agent { offset-distance: 100%; } }
</style>
