<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 362 199" width="362" height="199" role="img">
<!-- The scale diagram of the memex site: sixty files, each a dim block of code under a thin orange strip of intent; an agent zigzags down through the few strips that matter and opens one file. It follows light and dark through its own prefers-color-scheme block. -->
<title>A short path through the intent layer</title>
<desc>A grid of sixty dim blocks of code, each topped by a thin orange strip: its README or header. An agent starts at the top left and zigzags down the grid, reading one strip per row, six in all, and opens only the last file. The other strips stay dim and the other blocks stay closed.</desc>
<style>
svg { --bg: #faf7f0; --fg: #1c1a17; --muted: #5c574d; --accent: #9a3d17; --rule: #d8d1c0; --code: #ebe5d7; --code-line: #d3cab6; color: var(--fg); }
@media (prefers-color-scheme: dark) { svg { --bg: #141310; --fg: #ebe7dd; --muted: #a8a295; --accent: #eca071; --rule: #35322a; --code: #0c0b09; --code-line: #2a2722; } }
.code { fill: var(--code); stroke: var(--rule); stroke-width: 1; }
.cl { stroke: var(--code-line); stroke-width: 2; stroke-linecap: round; }
.strip { fill: var(--accent); }
.dim { fill: var(--accent); opacity: .3; }
.trail { fill: none; stroke: var(--accent); stroke-width: 1.25; stroke-dasharray: 1.5 3.5; stroke-linecap: round; stroke-linejoin: round; opacity: .5; }
.run { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: sweep 9s linear infinite; }
.sweep { fill: none; stroke: #fff; stroke-width: 4; stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: sweep 9s linear infinite; }
.open { fill: none; stroke: var(--accent); stroke-width: 1.25; stroke-dasharray: 3 2.5; animation: open 9s linear infinite; }
.agent { fill: var(--accent); stroke: var(--bg); stroke-width: 1.5; animation: run 9s linear infinite; }
@keyframes sweep { 0% { stroke-dashoffset: 1000; } 70%, 92% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
@keyframes run { 0% { offset-distance: 0%; opacity: 1; } 70%, 92% { offset-distance: 100%; opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
@keyframes open { 0%, 68% { opacity: 0; } 74%, 92% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .run, .sweep, .agent, .open { animation: none; } .run, .sweep { stroke-dashoffset: 0; } .agent { offset-distance: 100%; } }
</style>
