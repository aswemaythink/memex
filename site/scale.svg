<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img">
<!-- The scale diagram of the memex site: forty files, each a dim block of code under a thin orange header strip; an agent zigzags down the gutters, lights the few strips it reads, then reads the code of three files those headers pointed to. It follows light and dark through its own prefers-color-scheme block. -->
<title>A short path through the intent layer</title>
<desc>A grid of forty dim blocks of code, each topped by a faint orange strip: its README or header. An agent starts at the top left and zigzags down the gaps between the blocks, never over them. Each strip it reads on the way lights up and stays lit, one per row. Then the code of three of those files lights up, one after another: the files the headers pointed to. The other strips and blocks stay faint.</desc>
<style>
svg { --bg: #faf7f0; --accent: #9a3d17; --rule: #d8d1c0; --code: #ebe5d7; --code-line: #d3cab6; }
@media (prefers-color-scheme: dark) { svg { --bg: #141310; --accent: #eca071; --rule: #35322a; --code: #0c0b09; --code-line: #2a2722; } }
.code { fill: var(--code); stroke: var(--rule); stroke-width: 1; }
.cl { stroke: var(--code-line); stroke-width: 2.5; stroke-linecap: round; }
.strip { fill: var(--accent); opacity: .28; }
.read { fill: var(--accent); }
.trail { fill: none; stroke: var(--accent); stroke-width: 1.25; stroke-dasharray: 1.5 4; stroke-linecap: round; opacity: .3; }
.run { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; opacity: .4; stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: run 10s linear infinite; }
.agent { fill: var(--accent); stroke: var(--bg); stroke-width: 2; offset-path: path('M5 13L265 13Q271 13 271 19L271 73Q271 79 265 79L11 79Q5 79 5 85L5 139Q5 145 11 145L532 145Q538 145 538 151L538 205Q538 211 532 211L277 211Q271 211 271 217L271 271Q271 277 277 277L582.5 277'); animation: agent 10s linear infinite; }
.hl { opacity: 0; animation: 10s linear infinite; }
.hl rect { fill: var(--accent); fill-opacity: .07; stroke: var(--accent); stroke-width: 1.25; }
.hl path { stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; opacity: .6; }
@keyframes run { 0% { stroke-dashoffset: 1000; } 70%, 92% { stroke-dashoffset: 0; opacity: .4; } 100% { stroke-dashoffset: 0; opacity: 0; } }
@keyframes agent { 0% { offset-distance: 0%; opacity: 1; } 70%, 92% { offset-distance: 100%; opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
@keyframes lit0 { 0%, 7.5% { opacity: .28; } 9.0%, 92% { opacity: 1; } 100% { opacity: .28; } }
@keyframes lit1 { 0%, 19.6% { opacity: .28; } 21.1%, 92% { opacity: 1; } 100% { opacity: .28; } }
@keyframes lit2 { 0%, 38.3% { opacity: .28; } 39.8%, 92% { opacity: 1; } 100% { opacity: .28; } }
@keyframes lit3 { 0%, 53.8% { opacity: .28; } 55.3%, 92% { opacity: 1; } 100% { opacity: .28; } }
@keyframes lit4 { 0%, 69.2% { opacity: .28; } 70.8%, 92% { opacity: 1; } 100% { opacity: .28; } }
@keyframes hl0 { 0%, 71% { opacity: 0; } 73%, 92% { opacity: 1; } 100% { opacity: 0; } }
@keyframes hl1 { 0%, 75% { opacity: 0; } 77%, 92% { opacity: 1; } 100% { opacity: 0; } }
@keyframes hl2 { 0%, 79% { opacity: 0; } 81%, 92% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .run, .agent, .hl, .read { animation: none; } .hl { opacity: 1; } .run { stroke-dashoffset: 0; } .agent { offset-distance: 100%; } }
</style>
