<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 352 270" width="352" height="270" role="img">
<!-- The two-way citation diagram of the memex site: a README cites a case id, the case lists it under cited by, and rg finds the test. It follows light and dark through its own prefers-color-scheme block. -->
<style>
svg { --bg: #faf7f0; --bg-soft: #f1ece0; --fg: #1c1a17; --muted: #5c574d; --accent: #9a3d17; --rule: #d8d1c0; --trail: #948462; color: var(--fg); }
@media (prefers-color-scheme: dark) { svg { --bg: #141310; --bg-soft: #1b1915; --fg: #ebe7dd; --muted: #a8a295; --accent: #eca071; --rule: #35322a; --trail: #7a7058; } }
text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: currentColor; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.mut { fill: var(--muted); }
.acc { fill: var(--accent); }
.box { fill: var(--bg-soft); stroke: var(--rule); }
.plain { fill: var(--bg); stroke: var(--rule); }
.edge { fill: var(--accent); }
.dim { fill: var(--rule); }
.line { fill: none; stroke: var(--muted); stroke-width: 1.5; }
.aline { fill: none; stroke: var(--accent); stroke-width: 1.75; }
.dash { stroke-dasharray: 4 4; }
.ahead { fill: var(--muted); }
.aheada { fill: var(--accent); }
</style>
        <title id="ct-t">Citations, resolved in both directions</title>
        <desc id="ct-d">A README cites the case id NAME-001. The case entry in CASES.md lists the README under cited by. The test carries the id in a comment, so rg NAME-001 finds it.</desc>
        <defs>
          <marker id="ah2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aheada" d="M0 0L10 5L0 10z"/></marker>
          <marker id="ah3" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahead" d="M0 0L10 5L0 10z"/></marker>
        </defs>
        <rect class="box" x="56" y="4" width="240" height="56" rx="6"/><rect class="edge" x="56" y="4" width="4" height="56" rx="1"/>
        <text x="70" y="26" font-size="12" class="mono">crates/namer/README.md</text>
        <text x="70" y="46" font-size="12.5" class="mut">… stable names, see <tspan class="mono acc" font-size="12">NAME-001</tspan></text>

        <path class="aline" d="M150 64V100" marker-end="url(#ah2)"/>
        <text x="142" y="86" font-size="12" text-anchor="end" class="acc">cites</text>
        <path class="aline" d="M202 102V66" marker-end="url(#ah2)"/>
        <text x="210" y="86" font-size="12" class="acc">cited by</text>

        <rect class="box" x="56" y="106" width="240" height="56" rx="6"/><rect class="edge" x="56" y="106" width="4" height="56" rx="1"/>
        <text x="70" y="128" font-size="12" class="mono">tests/CASES.md · <tspan class="acc">NAME-001</tspan></text>
        <text x="70" y="148" font-size="12.5" class="mut">Class names are stable across runs.</text>

        <path class="line dash" d="M176 166V202" marker-end="url(#ah3)"/>
        <text x="186" y="188" font-size="12" class="mono mut">rg NAME-001</text>

        <rect class="plain" x="56" y="208" width="240" height="56" rx="6"/><rect class="dim" x="56" y="208" width="4" height="56" rx="1"/>
        <text x="70" y="230" font-size="12" class="mono">tests/namer_stable.rs</text>
        <text x="70" y="250" font-size="12" class="mono mut">// NAME-001</text>
      </svg>
