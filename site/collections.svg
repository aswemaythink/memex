<g class="lit kept end" style="animation-name: l2"><rect class="box" x="44" y="164" width="364" height="36" rx="8"/><text x="58" y="185.2" class="mono id">PERF-03</text><text x="118" y="185.8" class="title">serve images as WebP</text><rect class="tag" x="348" y="173" width="46" height="18" rx="9"/><text x="371.0" y="184.8" class="mono lab tagt" text-anchor="middle">KEPT</text></g>
