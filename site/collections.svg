<g class="lit kept end" style="animation-name: l0"><rect class="box" x="44" y="72" width="364" height="36" rx="8"/><text x="58" y="93.2" class="mono id">PERF-01</text><text x="118" y="93.8" class="title">virtualise the product list</text><rect class="tag" x="348" y="81" width="46" height="18" rx="9"/><text x="371.0" y="92.8" class="mono lab tagt" text-anchor="middle">KEPT</text></g>
