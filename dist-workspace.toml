# The cargo-dist release settings: the targets, installers and publish jobs of each release.
# The release workflow, .github/workflows/release.yml, is generated by dist from these settings.

[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew", "npm"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Names were fixed during the build. The GitHub org, the npm scope and the tap are not checked against the live services.
# Homebrew tap repo that the formula is pushed to
tap = "aswemaythink/homebrew-tap"
# Homebrew formula name, so the install is `brew install aswemaythink/tap/memex`
formula = "memex"
# npm scope and package name, so the package is `@aswemaythink/memex`
npm-scope = "@aswemaythink"
npm-package = "memex"
# Publish the formula and the npm package on stable tags. They need the HOMEBREW_TAP_TOKEN and NPM_TOKEN secrets.
publish-jobs = ["homebrew", "npm"]
# Accept action-version bumps (Dependabot) in the generated release.yml instead of failing `dist plan`.
allow-dirty = ["ci"]
