# Install smoke for memex on 3 OSes: installs a published release with its shell or PowerShell installer,
# then runs `memex init` and `memex info` in a temp git repo. It runs after the Release workflow succeeds
# on a tag push, or by hand with a tag. No secrets, no publishing.
name: Install smoke

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to install, for example v0.1.0-rc.1"
        required: true
        type: string
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    name: "install (${{ matrix.os }})"
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - name: Refuse an empty tag
        shell: bash
        run: |
          if [ -z "${TAG:-}" ]; then echo "no release tag to install"; exit 1; fi
          echo "installing ${TAG}"

      - name: Install with the shell installer
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/agent-memex-installer.sh" | sh
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"

      - name: Install with the PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          irm "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/agent-memex-installer.ps1" | iex
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $cargoHome 'bin')

      - name: Check that the installed memex is the tag
        shell: bash
        run: |
          set -euo pipefail
          want="${TAG#v}"
          got="$(memex --version)"
          echo "$got"
          case "$got" in
            *"$want"*) ;;
            *) echo "memex --version does not show $want"; exit 1 ;;
          esac

      - name: Init and info in a temp git repo
        shell: bash
        run: |
          set -euo pipefail
          repo="$(mktemp -d)"
          cd "$repo"
          git init -q
          memex init
          memex info
