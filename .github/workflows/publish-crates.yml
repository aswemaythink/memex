# Publishes the tagged memex to crates.io as agent-memex; release.yml calls it as a dist publish job.
# Needs the CARGO_REGISTRY_TOKEN secret. A version already on crates.io is skipped, so a re-run is safe.
name: Publish to crates.io

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish agent-memex
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "agent-memex") | .version')
          status=$(curl -s -o /dev/null -w '%{http_code}' -A 'memex-release (https://github.com/aswemaythink/memex)' \
            "https://crates.io/api/v1/crates/agent-memex/$version")
          if [ "$status" = "200" ]; then echo "agent-memex $version is already on crates.io"; exit 0; fi
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set: add it as a repository secret (see CONTRIBUTING.md, Releases)"
            exit 1
          fi
          cargo publish --locked
