# Dependabot: weekly PRs for GitHub Actions and Cargo, with minor and patch updates grouped.
# release.yml is generated by cargo-dist and checked by `dist plan`, so Dependabot leaves it alone: its actions move
# with cargo-dist-version in dist-workspace.toml.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    exclude-paths:
      - ".github/workflows/release.yml"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    # dtolnay/rust-toolchain@1.88 pins the MSRV job to the crate's rust-version; it moves only with Cargo.toml.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    groups:
      cargo:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
