# Feature request form: the problem first, then the proposed behaviour.
# A feature needs a design.md change, approved by a maintainer, before any code is written.
name: Feature request
description: Propose a change in behaviour. A feature needs a design.md change first.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        memex adds a feature only when it removes friction that an agent actually hit in a playtest.
        The behaviour is written into [design.md](https://github.com/aswemaythink/memex/blob/main/design.md) first;
        section 1 of that file sets the principles.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What were you or an agent trying to do, and where did it get stuck?
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Proposed behaviour
      description: What should memex do? Name the command, its output and what happens on failure.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Optional.
  - type: checkboxes
    id: design
    attributes:
      label: Design check
      options:
        - label: I have read design.md section 1, and I know a feature needs a design.md change approved first.
          required: true
