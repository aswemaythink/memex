[package]
name = "agent-memex"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "A CLI that indexes a repo's authored intent layer so agents read intent before code."
repository = "https://github.com/rynwhite/memex"
exclude = ["tests/", "site/", "plugins/"]

[lib]
name = "memex"
path = "src/lib.rs"

[[bin]]
name = "memex"
path = "src/main.rs"

[[test]]
name = "conformance"
path = "tests/conformance.rs"
harness = false

[[test]]
name = "runner_selftest"
path = "tests/runner_selftest.rs"

[[test]]
name = "quality"
path = "tests/quality.rs"

[dependencies]
dunce = "1.0.5"
# Pinned: ignore 0.4.31 and later declare rust-version 1.88, above this crate's MSRV of 1.85.
ignore = "=0.4.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"

[dev-dependencies]
libtest-mimic = "0.8.2"
similar = "3.2.0"

[lints.rust]
unsafe_code = "forbid"
# Public items of the lib only: the bin and the test crates export nothing.
missing_docs = "warn"

[lints.clippy]
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
uninlined_format_args = "warn"
cognitive_complexity = "warn"
too_many_lines = "warn"
too_many_arguments = "warn"
# Tests may unwrap: see allow-unwrap-in-tests in clippy.toml.
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
