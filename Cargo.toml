[package]
name = "agent-memex"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "A CLI that indexes a repo's authored intent layer so agents read intent before code."
repository = "https://github.com/rynwhite/memex"
exclude = ["tests/", "site/", "plugins/"]

[lib]
name = "memex"
path = "src/lib.rs"

[[bin]]
name = "memex"
path = "src/main.rs"

[[test]]
name = "conformance"
path = "tests/conformance.rs"
harness = false

[[test]]
name = "runner_selftest"
path = "tests/runner_selftest.rs"

[dev-dependencies]
dunce = "1.0.5"
libtest-mimic = "0.8.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.0"
tempfile = "3.27.0"
